<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #132033;
  --ink-soft: #334155;
  --muted: #4b5c72;
  --line: rgba(19, 32, 51, 0.12);
  --paper: #f4f0e8;
  --surface: rgba(255, 253, 249, 0.94);
  --accent: #0c73b8;
  --accent-2: #b57912;
  --accent-soft: rgba(12, 115, 184, 0.12);
  --gold: #e0ad5a;
  --sky: #6bbce8;
  --code-bg: #eef5fa;
  --content-width: 780px;
  --radius: 14px;
  --font: "Figtree", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font);
  font-size: 17.5px;
  line-height: 1.75;
  letter-spacing: -0.01em;
  background:
    radial-gradient(1000px 560px at 6% -8%, rgba(107, 188, 232, 0.26), transparent 55%),
    radial-gradient(820px 520px at 96% 4%, rgba(224, 173, 90, 0.20), transparent 52%),
    linear-gradient(180deg, #f3efe8 0%, var(--paper) 40%, #f7f4ef 100%);
}

.shell {
  width: min(var(--content-width), calc(100% - 36px));
  margin: 0 auto;
  padding: 18px 0 96px;
}

.nav {
  position: sticky;
  top: 12px;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 28px rgba(19, 32, 51, 0.05);
  margin-bottom: 28px;
}
.nav a {
  color: var(--ink-soft);
  text-decoration: none;
  font-size: 0.86rem;
  font-weight: 600;
  padding: 7px 11px;
  border-radius: 999px;
}
.nav a:hover {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav .spacer { flex: 1 1 auto; }
.nav .src {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.72rem;
  padding: 0 8px;
  max-width: 42%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reading {
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255, 253, 249, 0.86);
  box-shadow: 0 18px 48px rgba(19, 32, 51, 0.06);
  padding: 36px 40px 48px;
}

#loading {
  color: var(--muted);
  font-size: 0.95rem;
  padding: 8px 0 20px;
}
#error {
  display: none;
  background: #fff1f2;
  border: 1px solid #fecdd3;
  color: #9f1239;
  padding: 14px 16px;
  border-radius: 12px;
  margin-bottom: 16px;
}

#content h1 {
  margin: 0 0 0.45em;
  font-size: clamp(1.85rem, 3.6vw, 2.45rem);
  line-height: 1.18;
  letter-spacing: -0.035em;
  font-weight: 800;
  color: var(--ink);
}
#content h1::after {
  content: "";
  display: block;
  width: 72px;
  height: 4px;
  border-radius: 999px;
  margin-top: 14px;
  background: linear-gradient(90deg, var(--accent), var(--gold));
}

#content h2 {
  margin: 2em 0 0.7em;
  font-size: 1.32rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
  padding-bottom: 0.4em;
  border-bottom: 1px solid var(--line);
}
#content h3 {
  margin: 1.55em 0 0.55em;
  font-size: 1.08rem;
  font-weight: 700;
  color: var(--ink-soft);
}
#content p { margin: 0.9em 0; color: #1b2a3d; }
#content strong { font-weight: 700; color: var(--ink); }

#content blockquote {
  margin: 1.25em 0;
  padding: 14px 16px 14px 18px;
  border-radius: 12px;
  border: 1px solid rgba(12, 115, 184, 0.12);
  border-left: 3px solid var(--accent);
  background: linear-gradient(120deg, rgba(107, 188, 232, 0.12), rgba(224, 173, 90, 0.10));
  color: var(--ink-soft);
  font-style: normal;
}
#content blockquote p { margin: 0.35em 0; }

#content ul, #content ol {
  margin: 0.85em 0;
  padding-left: 1.35em;
}
#content li { margin: 0.42em 0; color: #1b2a3d; }
#content li::marker { color: var(--accent); font-weight: 600; }

#content code {
  font-family: var(--mono);
  font-size: 0.86em;
  background: var(--code-bg);
  color: #0a4f7c;
  padding: 0.12em 0.42em;
  border-radius: 6px;
  border: 1px solid rgba(12, 115, 184, 0.12);
}
#content pre {
  background: #132033;
  color: #e8eef5;
  padding: 16px 18px;
  border-radius: 14px;
  overflow-x: auto;
  font-size: 0.88rem;
  line-height: 1.6;
  box-shadow: 0 12px 30px rgba(19, 32, 51, 0.12);
}
#content pre code {
  background: transparent;
  color: inherit;
  padding: 0;
  border: 0;
}

#content table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  margin: 1.3em 0;
  font-size: 0.93em;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #fff;
}
#content th, #content td {
  padding: 0.7em 0.9em;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
#content th {
  background: linear-gradient(120deg, rgba(107, 188, 232, 0.16), rgba(224, 173, 90, 0.12));
  font-weight: 700;
  color: var(--ink);
}
#content tr:last-child td { border-bottom: none; }
#content tr:nth-child(even) td { background: rgba(244, 240, 232, 0.45); }

#content a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(12, 115, 184, 0.28);
}
#content a:hover {
  color: #0a63a0;
  border-bottom-color: rgba(12, 115, 184, 0.6);
}

#content hr {
  border: 0;
  height: 1px;
  margin: 2.2em 0;
  background: linear-gradient(90deg, transparent, rgba(19,32,51,0.16), transparent);
}

#content img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 1.4em auto;
  border-radius: 12px;
  border: 1px solid var(--line);
}

.chapter-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
}
.chapter-nav a {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.78);
  text-decoration: none;
  color: var(--ink);
  transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
  min-height: 74px;
}
.chapter-nav a:hover {
  border-color: rgba(12,115,184,0.35);
  background: #fff;
  transform: translateY(-2px);
  color: var(--ink);
}
.chapter-nav .dir {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.04em;
}
.chapter-nav .title {
  font-size: 0.95rem;
  font-weight: 700;
  line-height: 1.35;
}
.chapter-nav .next { text-align: right; align-items: flex-end; }
.chapter-nav .placeholder {
  visibility: hidden;
  pointer-events: none;
}
.chapter-nav.top {
  margin: 0 0 22px;
  padding: 0 0 18px;
  border-top: 0;
  border-bottom: 1px solid var(--line);
}

.series-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 0.86rem;
}
.series-bar a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
  border-bottom: 1px solid rgba(12,115,184,0.25);
}
.series-bar a:hover { border-bottom-color: rgba(12,115,184,0.55); }
.series-bar .pos {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--accent-2);
  font-weight: 600;
}

.foot-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 28px;
}
.foot-nav a {
  display: inline-flex;
  align-items: center;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.72);
  color: var(--ink);
  text-decoration: none;
  font-weight: 700;
  font-size: 0.88rem;
}
.foot-nav a:hover {
  border-color: rgba(12,115,184,0.35);
  color: var(--accent);
}

@media (max-width: 720px) {
  .reading { padding: 24px 18px 36px; border-radius: 16px; }
  .nav { border-radius: 18px; }
  .nav .src { max-width: 100%; }
  .chapter-nav { grid-template-columns: 1fr; }
  .chapter-nav .next { text-align: left; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="导读导航">
    <a href="index.html">门户首页</a>
    <a href="md.html?src=guides/README.md">学习路径</a>
    <a href="md.html?src=llm-notes/README.md">面试笔记</a>
    <a href="md.html?src=inference-engineering/README.md">Kiely 书</a>
    <a href="book.zh.html">Vizuara 书</a>
    <a href="guides/README.md" id="raw-link" hidden>源文件</a>
    <span class="spacer"></span>
    <span class="src" id="src-label"></span>
  </nav>

  <div id="loading">正在渲染 Markdown…</div>
  <div id="error"></div>
  <div class="reading">
    <div class="series-bar" id="series-bar" hidden></div>
    <div class="chapter-nav top" id="chapter-nav-top" hidden></div>
    <article id="content"></article>
    <div class="chapter-nav" id="chapter-nav-bottom" hidden></div>
  </div>

  <div class="foot-nav">
    <a href="index.html">返回门户</a>
    <a href="visual-walkthroughs.html">可视化 Walkthroughs</a>
    <a href="md.html?src=guides/lectures/README.md">全部导读</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const src = params.get('src') || '';
  const loading = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const content = document.getElementById('content');
  const srcLabel = document.getElementById('src-label');
  const rawLink = document.getElementById('raw-link');
  const seriesBar = document.getElementById('series-bar');
  const navTop = document.getElementById('chapter-nav-top');
  const navBottom = document.getElementById('chapter-nav-bottom');

  // Reading sequences: README/index first, then chapters in order.
  const SERIES = [
    {
      name: '面试口袋笔记',
      index: 'llm-notes/README.md',
      files: [
        'llm-notes/README.md',
        'llm-notes/01-推理问题.md',
        'llm-notes/02-硬件基础.md',
        'llm-notes/03-Transformer推理机制.md',
        'llm-notes/04-量化.md',
        'llm-notes/05-投机解码.md',
        'llm-notes/06-KV-Cache优化.md',
        'llm-notes/07-内核工程与FlashAttention.md',
        'llm-notes/08-服务系统架构.md',
        'llm-notes/09-并行.md',
        'llm-notes/10-长上下文与内存管理.md',
        'llm-notes/11-边缘与端侧推理.md',
        'llm-notes/12-推理时计算扩展.md',
        'llm-notes/13-可观测性与生产工程.md',
        'llm-notes/14-推理的未来.md',
        'llm-notes/附录.md'
      ]
    },
    {
      name: 'Philip Kiely《Inference Engineering》',
      index: 'inference-engineering/README.md',
      files: [
        'inference-engineering/README.md',
        'inference-engineering/00-前言.md',
        'inference-engineering/01-推理.md',
        'inference-engineering/02-先决条件.md',
        'inference-engineering/03-模型.md',
        'inference-engineering/04-硬件.md',
        'inference-engineering/05-软件.md',
        'inference-engineering/06-技术.md',
        'inference-engineering/07-多模态.md',
        'inference-engineering/08-生产.md',
        'inference-engineering/附录A-术语表.md',
        'inference-engineering/附录B-推荐阅读.md'
      ]
    },
    {
      name: '每讲中文导读',
      index: 'guides/lectures/README.md',
      files: [
        'guides/lectures/README.md',
        'guides/lectures/01-推理工程导论.md',
        'guides/lectures/02-KV-Cache-的善与恶.md',
        'guides/lectures/03-注意力变体-Part1.md',
        'guides/lectures/04-注意力变体-Part2.md',
        'guides/lectures/05-FlashAttention.md',
        'guides/lectures/06-vLLM-Step-的解剖.md',
        'guides/lectures/07-量化.md',
        'guides/lectures/08-投机解码.md',
        'guides/lectures/09-Bonus-推理与YC.md',
        'guides/lectures/10-硬件实验.md',
        'guides/lectures/11-Capstone-项目.md'
      ]
    },
    {
      name: '学习路径与术语',
      index: 'guides/README.md',
      files: [
        'guides/README.md',
        'guides/00-学习路径.md',
        'guides/00-术语表.md',
        'guides/00-环境搭建.md',
        'guides/lectures/README.md'
      ]
    },
    {
      name: '生产推理系统笔记（中文）',
      index: 'lecture-notes/l13-production-inference-systems/README.md',
      files: [
        'lecture-notes/l13-production-inference-systems/README.md',
        'lecture-notes/l13-production-inference-systems/01-production-systems.zh.md',
        'lecture-notes/l13-production-inference-systems/02-structured-output-and-evals.zh.md',
        'lecture-notes/l13-production-inference-systems/03-disaggregated-serving-deep-dive.zh.md',
        'lecture-notes/l13-production-inference-systems/04-final-system-design-interview-answer.zh.md'
      ]
    },
    {
      name: '生产推理系统笔记（英文）',
      index: 'lecture-notes/l13-production-inference-systems/README.md',
      files: [
        'lecture-notes/l13-production-inference-systems/README.md',
        'lecture-notes/l13-production-inference-systems/01-production-systems.md',
        'lecture-notes/l13-production-inference-systems/02-structured-output-and-evals.md',
        'lecture-notes/l13-production-inference-systems/03-disaggregated-serving-deep-dive.md',
        'lecture-notes/l13-production-inference-systems/04-final-system-design-interview-answer.md'
      ]
    }
  ];

  const titleCache = Object.create(null);

  function showError(msg) {
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = msg;
  }

  function normalizeSrc(path) {
    path = String(path || '').replace(/^\/+/, '').replace(/\\/g, '/');
    if (!path || path.includes('..') || path.startsWith('/') || /^[a-z]+:/i.test(path)) {
      return null;
    }
    if (!path.toLowerCase().endsWith('.md')) return null;
    return path;
  }

  function dirname(path) {
    const i = path.lastIndexOf('/');
    return i >= 0 ? path.slice(0, i + 1) : '';
  }

  function basename(path) {
    const i = path.lastIndexOf('/');
    return i >= 0 ? path.slice(i + 1) : path;
  }

  function joinPath(baseDir, rel) {
    if (/^[a-z]+:/i.test(rel) || rel.startsWith('//') || rel.startsWith('#') || rel.startsWith('mailto:')) {
      return rel;
    }
    const stack = baseDir ? baseDir.replace(/\/$/, '').split('/') : [];
    for (const part of rel.split('/')) {
      if (!part || part === '.') continue;
      if (part === '..') stack.pop();
      else stack.push(part);
    }
    return stack.join('/');
  }

  function rewriteLinks(root, baseDir) {
    root.querySelectorAll('a[href]').forEach((a) => {
      const href = a.getAttribute('href');
      if (!href || /^[a-z]+:/i.test(href) || href.startsWith('//') || href.startsWith('#') || href.startsWith('mailto:')) {
        return;
      }
      const resolved = joinPath(baseDir, href);
      if (resolved.toLowerCase().endsWith('.md')) {
        a.setAttribute('href', 'md.html?src=' + encodeURIComponent(resolved));
      } else {
        a.setAttribute('href', resolved);
      }
    });
    root.querySelectorAll('img[src]').forEach((img) => {
      const srcAttr = img.getAttribute('src');
      if (!srcAttr || /^[a-z]+:/i.test(srcAttr) || srcAttr.startsWith('//') || srcAttr.startsWith('data:')) return;
      img.setAttribute('src', joinPath(baseDir, srcAttr));
    });
  }

  function findSeries(path) {
    // Prefer the most specific series that contains this exact path.
    // For shared README in lecture-notes, prefer Chinese series when path ends with .zh.md
    // already exact match handles that.
    for (const s of SERIES) {
      if (s.files.indexOf(path) >= 0) return s;
    }
    return null;
  }

  function fallbackTitle(path) {
    return basename(path).replace(/\.md$/i, '').replace(/\.zh$/i, '');
  }

  function fetchTitle(path) {
    if (titleCache[path]) return Promise.resolve(titleCache[path]);
    return fetch(path)
      .then((r) => (r.ok ? r.text() : ''))
      .then((md) => {
        const m = md.match(/^#\s+(.+)$/m);
        const title = m ? m[1].trim() : fallbackTitle(path);
        titleCache[path] = title;
        return title;
      })
      .catch(() => {
        const title = fallbackTitle(path);
        titleCache[path] = title;
        return title;
      });
  }

  function mdHref(path) {
    return 'md.html?src=' + encodeURIComponent(path);
  }

  function renderNavPair(container, prev, next, prevTitle, nextTitle) {
    container.hidden = false;
    container.innerHTML = '';

    if (prev) {
      const a = document.createElement('a');
      a.href = mdHref(prev);
      a.innerHTML = '<span class="dir">← 上一章</span><span class="title"></span>';
      a.querySelector('.title').textContent = prevTitle;
      container.appendChild(a);
    } else {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      container.appendChild(ph);
    }

    if (next) {
      const a = document.createElement('a');
      a.className = 'next';
      a.href = mdHref(next);
      a.innerHTML = '<span class="dir">下一章 →</span><span class="title"></span>';
      a.querySelector('.title').textContent = nextTitle;
      container.appendChild(a);
    } else {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      container.appendChild(ph);
    }
  }

  function setupSeriesNav(path) {
    const series = findSeries(path);
    if (!series) return null;

    const idx = series.files.indexOf(path);
    const prev = idx > 0 ? series.files[idx - 1] : null;
    const next = idx < series.files.length - 1 ? series.files[idx + 1] : null;

    seriesBar.hidden = false;
    seriesBar.innerHTML =
      '<span>系列：</span><a href="' + mdHref(series.index) + '">' + series.name + '</a>' +
      '<span class="pos">' + (idx + 1) + ' / ' + series.files.length + '</span>';

    const tasks = [];
    if (prev) tasks.push(fetchTitle(prev).then((t) => ({ side: 'prev', title: t })));
    if (next) tasks.push(fetchTitle(next).then((t) => ({ side: 'next', title: t })));

    return Promise.all(tasks).then((items) => {
      let prevTitle = '';
      let nextTitle = '';
      items.forEach((it) => {
        if (it.side === 'prev') prevTitle = it.title;
        if (it.side === 'next') nextTitle = it.title;
      });
      renderNavPair(navTop, prev, next, prevTitle, nextTitle);
      renderNavPair(navBottom, prev, next, prevTitle, nextTitle);

      // Keyboard: ← / →
      document.addEventListener('keydown', (e) => {
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/i.test(e.target.tagName)) return;
        if (e.key === 'ArrowLeft' && prev) location.href = mdHref(prev);
        if (e.key === 'ArrowRight' && next) location.href = mdHref(next);
      });

      return { prev, next };
    });
  }

  const safeSrc = normalizeSrc(src);
  if (!safeSrc) {
    showError('缺少或非法的 src 参数。示例：md.html?src=guides/lectures/06-vLLM-Step-的解剖.md');
    return;
  }

  srcLabel.textContent = safeSrc;
  rawLink.hidden = false;
  rawLink.href = safeSrc;
  rawLink.textContent = '源文件';

  fetch(safeSrc)
    .then((r) => {
      if (!r.ok) throw new Error('无法加载 ' + safeSrc + '（HTTP ' + r.status + '）');
      return r.text();
    })
    .then((md) => {
      loading.style.display = 'none';
      const titleMatch = md.match(/^#\s+(.+)$/m);
      if (titleMatch) {
        const title = titleMatch[1].trim();
        document.title = title + ' — 导读';
        titleCache[safeSrc] = title;
      }
      content.innerHTML = marked.parse(md, { gfm: true, breaks: false });
      rewriteLinks(content, dirname(safeSrc));
      return setupSeriesNav(safeSrc);
    })
    .catch((err) => showError(err.message || String(err)));
})();
</script>
</body>
