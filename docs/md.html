<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #132033;
  --ink-soft: #334155;
  --muted: #4b5c72;
  --line: rgba(19, 32, 51, 0.12);
  --paper: #f4f0e8;
  --surface: rgba(255, 253, 249, 0.94);
  --accent: #0c73b8;
  --accent-2: #b57912;
  --accent-soft: rgba(12, 115, 184, 0.12);
  --gold: #e0ad5a;
  --sky: #6bbce8;
  --code-bg: #eef5fa;
  --content-width: 780px;
  --radius: 14px;
  --font: "Figtree", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font);
  font-size: 17.5px;
  line-height: 1.75;
  letter-spacing: -0.01em;
  background:
    radial-gradient(1000px 560px at 6% -8%, rgba(107, 188, 232, 0.26), transparent 55%),
    radial-gradient(820px 520px at 96% 4%, rgba(224, 173, 90, 0.20), transparent 52%),
    linear-gradient(180deg, #f3efe8 0%, var(--paper) 40%, #f7f4ef 100%);
}

.shell {
  width: min(var(--content-width), calc(100% - 36px));
  margin: 0 auto;
  padding: 18px 0 96px;
}

.nav {
  position: sticky;
  top: 12px;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 28px rgba(19, 32, 51, 0.05);
  margin-bottom: 28px;
}
.nav a {
  color: var(--ink-soft);
  text-decoration: none;
  font-size: 0.86rem;
  font-weight: 600;
  padding: 7px 11px;
  border-radius: 999px;
}
.nav a:hover {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav .spacer { flex: 1 1 auto; }
.nav .src {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.72rem;
  padding: 0 8px;
  max-width: 42%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reading {
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255, 253, 249, 0.86);
  box-shadow: 0 18px 48px rgba(19, 32, 51, 0.06);
  padding: 36px 40px 48px;
}

#loading {
  color: var(--muted);
  font-size: 0.95rem;
  padding: 8px 0 20px;
}
#error {
  display: none;
  background: #fff1f2;
  border: 1px solid #fecdd3;
  color: #9f1239;
  padding: 14px 16px;
  border-radius: 12px;
  margin-bottom: 16px;
}

#content h1 {
  margin: 0 0 0.45em;
  font-size: clamp(1.85rem, 3.6vw, 2.45rem);
  line-height: 1.18;
  letter-spacing: -0.035em;
  font-weight: 800;
  color: var(--ink);
}
#content h1::after {
  content: "";
  display: block;
  width: 72px;
  height: 4px;
  border-radius: 999px;
  margin-top: 14px;
  background: linear-gradient(90deg, var(--accent), var(--gold));
}

#content h2 {
  margin: 2em 0 0.7em;
  font-size: 1.32rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
  padding-bottom: 0.4em;
  border-bottom: 1px solid var(--line);
}
#content h3 {
  margin: 1.55em 0 0.55em;
  font-size: 1.08rem;
  font-weight: 700;
  color: var(--ink-soft);
}
#content p { margin: 0.9em 0; color: #1b2a3d; }
#content strong { font-weight: 700; color: var(--ink); }

#content blockquote {
  margin: 1.25em 0;
  padding: 14px 16px 14px 18px;
  border-radius: 12px;
  border: 1px solid rgba(12, 115, 184, 0.12);
  border-left: 3px solid var(--accent);
  background: linear-gradient(120deg, rgba(107, 188, 232, 0.12), rgba(224, 173, 90, 0.10));
  color: var(--ink-soft);
  font-style: normal;
}
#content blockquote p { margin: 0.35em 0; }

#content ul, #content ol {
  margin: 0.85em 0;
  padding-left: 1.35em;
}
#content li { margin: 0.42em 0; color: #1b2a3d; }
#content li::marker { color: var(--accent); font-weight: 600; }

#content code {
  font-family: var(--mono);
  font-size: 0.86em;
  background: var(--code-bg);
  color: #0a4f7c;
  padding: 0.12em 0.42em;
  border-radius: 6px;
  border: 1px solid rgba(12, 115, 184, 0.12);
}
#content pre {
  background: #132033;
  color: #e8eef5;
  padding: 16px 18px;
  border-radius: 14px;
  overflow-x: auto;
  font-size: 0.88rem;
  line-height: 1.6;
  box-shadow: 0 12px 30px rgba(19, 32, 51, 0.12);
}
#content pre code {
  background: transparent;
  color: inherit;
  padding: 0;
  border: 0;
}

#content table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  margin: 1.3em 0;
  font-size: 0.93em;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #fff;
}
#content th, #content td {
  padding: 0.7em 0.9em;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
#content th {
  background: linear-gradient(120deg, rgba(107, 188, 232, 0.16), rgba(224, 173, 90, 0.12));
  font-weight: 700;
  color: var(--ink);
}
#content tr:last-child td { border-bottom: none; }
#content tr:nth-child(even) td { background: rgba(244, 240, 232, 0.45); }

#content a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(12, 115, 184, 0.28);
}
#content a:hover {
  color: #0a63a0;
  border-bottom-color: rgba(12, 115, 184, 0.6);
}

#content hr {
  border: 0;
  height: 1px;
  margin: 2.2em 0;
  background: linear-gradient(90deg, transparent, rgba(19,32,51,0.16), transparent);
}

#content img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 1.4em auto;
  border-radius: 12px;
  border: 1px solid var(--line);
}

.foot-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 28px;
}
.foot-nav a {
  display: inline-flex;
  align-items: center;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.72);
  color: var(--ink);
  text-decoration: none;
  font-weight: 700;
  font-size: 0.88rem;
}
.foot-nav a:hover {
  border-color: rgba(12,115,184,0.35);
  color: var(--accent);
}

@media (max-width: 720px) {
  .reading { padding: 24px 18px 36px; border-radius: 16px; }
  .nav { border-radius: 18px; }
  .nav .src { max-width: 100%; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="导读导航">
    <a href="index.html">门户首页</a>
    <a href="md.html?src=guides/README.md">学习路径</a>
    <a href="md.html?src=llm-notes/README.md">面试笔记</a>
    <a href="md.html?src=inference-engineering/README.md">Kiely 书</a>
    <a href="book.zh.html">Vizuara 书</a>
    <a href="guides/README.md" id="raw-link" hidden>源文件</a>
    <span class="spacer"></span>
    <span class="src" id="src-label"></span>
  </nav>

  <div id="loading">正在渲染 Markdown…</div>
  <div id="error"></div>
  <div class="reading">
    <article id="content"></article>
  </div>

  <div class="foot-nav">
    <a href="index.html">返回门户</a>
    <a href="visual-walkthroughs.html">可视化 Walkthroughs</a>
    <a href="md.html?src=guides/lectures/README.md">全部导读</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const src = params.get('src') || '';
  const loading = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const content = document.getElementById('content');
  const srcLabel = document.getElementById('src-label');
  const rawLink = document.getElementById('raw-link');

  function showError(msg) {
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = msg;
  }

  function normalizeSrc(path) {
    path = String(path || '').replace(/^\/+/, '').replace(/\\/g, '/');
    if (!path || path.includes('..') || path.startsWith('/') || /^[a-z]+:/i.test(path)) {
      return null;
    }
    if (!path.toLowerCase().endsWith('.md')) return null;
    return path;
  }

  function dirname(path) {
    const i = path.lastIndexOf('/');
    return i >= 0 ? path.slice(0, i + 1) : '';
  }

  function joinPath(baseDir, rel) {
    if (/^[a-z]+:/i.test(rel) || rel.startsWith('//') || rel.startsWith('#') || rel.startsWith('mailto:')) {
      return rel;
    }
    const stack = baseDir ? baseDir.replace(/\/$/, '').split('/') : [];
    for (const part of rel.split('/')) {
      if (!part || part === '.') continue;
      if (part === '..') stack.pop();
      else stack.push(part);
    }
    return stack.join('/');
  }

  function rewriteLinks(root, baseDir) {
    root.querySelectorAll('a[href]').forEach((a) => {
      const href = a.getAttribute('href');
      if (!href || /^[a-z]+:/i.test(href) || href.startsWith('//') || href.startsWith('#') || href.startsWith('mailto:')) {
        return;
      }
      const resolved = joinPath(baseDir, href);
      if (resolved.toLowerCase().endsWith('.md')) {
        a.setAttribute('href', 'md.html?src=' + encodeURIComponent(resolved));
      } else {
        a.setAttribute('href', resolved);
      }
    });
    root.querySelectorAll('img[src]').forEach((img) => {
      const srcAttr = img.getAttribute('src');
      if (!srcAttr || /^[a-z]+:/i.test(srcAttr) || srcAttr.startsWith('//') || srcAttr.startsWith('data:')) return;
      img.setAttribute('src', joinPath(baseDir, srcAttr));
    });
  }

  const safeSrc = normalizeSrc(src);
  if (!safeSrc) {
    showError('缺少或非法的 src 参数。示例：md.html?src=guides/lectures/06-vLLM-Step-的解剖.md');
    return;
  }

  srcLabel.textContent = safeSrc;
  rawLink.hidden = false;
  rawLink.href = safeSrc;
  rawLink.textContent = '源文件';

  fetch(safeSrc)
    .then((r) => {
      if (!r.ok) throw new Error('无法加载 ' + safeSrc + '（HTTP ' + r.status + '）');
      return r.text();
    })
    .then((md) => {
      loading.style.display = 'none';
      const titleMatch = md.match(/^#\s+(.+)$/m);
      if (titleMatch) document.title = titleMatch[1].trim() + ' — 导读';
      content.innerHTML = marked.parse(md, { gfm: true, breaks: false });
      rewriteLinks(content, dirname(safeSrc));
    })
    .catch((err) => showError(err.message || String(err)));
})();
</script>
</body>
</html>
