<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gradient-primary: linear-gradient(100deg, #ffd78a 0%, #8ad4ff 50%, #ffa8ff 100%);
  --gradient-ultra-subtle: linear-gradient(120deg, rgba(255,215,138,0.08), rgba(138,212,255,0.10), rgba(255,168,255,0.08));
  --vizuara: #1e96e6;
  --bg-warm: #fbfaf7;
  --ink: #0f172a;
  --muted: #64748b;
  --rule: #e4e4e7;
  --code-bg: #f6f5f3;
  --content-width: 760px;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: 'Figtree', "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  font-weight: 300;
  font-size: 17px;
  line-height: 1.7;
  color: var(--ink);
  background:
    radial-gradient(ellipse 1400px 900px at 50% -200px, rgba(138, 212, 255, 0.06), transparent 60%),
    radial-gradient(ellipse 1200px 800px at 10% 300px, rgba(255, 168, 255, 0.05), transparent 60%),
    var(--bg-warm);
  margin: 0;
  padding: 0;
}
.page { max-width: var(--content-width); margin: 0 auto; padding: 40px 28px 100px; }
.top-nav {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  margin: 0 auto 28px; padding: 14px 18px;
  border-radius: var(--radius);
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(30,41,59,0.06);
  box-shadow: 0 8px 30px rgba(30,41,59,0.04);
  font-size: 0.9rem;
}
.top-nav a { color: var(--ink); text-decoration: none; border: 0; font-weight: 500; }
.top-nav a:hover { color: var(--vizuara); }
.top-nav .spacer { flex: 1 1 auto; }
.top-nav .src { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 0.78rem; word-break: break-all; }

#content h1 {
  font-size: 2.1rem; line-height: 1.2; margin: 0.2em 0 0.5em;
  letter-spacing: -0.02em;
  background: var(--gradient-primary);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
#content h2 {
  font-size: 1.35rem; font-weight: 700; margin: 1.8em 0 0.7em; color: #111827;
  padding-bottom: 0.35em; border-bottom: 1px solid var(--rule);
}
#content h3 { font-size: 1.1rem; font-weight: 600; margin: 1.4em 0 0.5em; color: #0f172a; }
#content p { margin: 0.85em 0; }
#content blockquote {
  margin: 1em 0; padding: 0.2em 0 0.2em 1em;
  border-left: 3px solid rgba(30,150,230,0.45);
  color: var(--muted); font-style: italic;
}
#content ul, #content ol { margin: 0.7em 0; padding-left: 1.4em; }
#content li { margin: 0.35em 0; }
#content code {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 0.88em; background: var(--code-bg);
  padding: 0.12em 0.4em; border-radius: 5px;
}
#content pre {
  background: #0f172a; color: #e2e8f0; padding: 14px 16px;
  border-radius: var(--radius); overflow-x: auto; font-size: 0.88rem;
}
#content pre code { background: transparent; color: inherit; padding: 0; }
#content table {
  border-collapse: separate; border-spacing: 0; width: 100%;
  margin: 1.2em 0; font-size: 0.92em; border-radius: var(--radius);
  overflow: hidden; box-shadow: 0 4px 20px rgba(30,41,59,0.05); background: #fff;
}
#content th, #content td {
  padding: 0.62em 0.9em; border-bottom: 1px solid var(--rule);
  text-align: left; vertical-align: top;
}
#content th { background: var(--gradient-ultra-subtle); font-weight: 600; }
#content tr:last-child td { border-bottom: none; }
#content a { color: var(--vizuara); text-decoration: none; border-bottom: 1px solid rgba(30,150,230,0.25); }
#content a:hover { border-bottom-color: rgba(30,150,230,0.6); }
#content strong { font-weight: 600; }
#content hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
#error {
  display: none; background: #fff1f2; border: 1px solid #fecdd3;
  color: #9f1239; padding: 14px 16px; border-radius: var(--radius);
}
#loading { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <div class="top-nav">
    <a href="index.html">← 门户首页</a>
    <a href="guides/README.md" id="raw-link" hidden>源文件</a>
    <span class="spacer"></span>
    <span class="src" id="src-label"></span>
  </div>
  <div id="loading">正在渲染 Markdown…</div>
  <div id="error"></div>
  <article id="content"></article>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const src = params.get('src') || '';
  const loading = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const content = document.getElementById('content');
  const srcLabel = document.getElementById('src-label');
  const rawLink = document.getElementById('raw-link');

  function showError(msg) {
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = msg;
  }

  function normalizeSrc(path) {
    path = String(path || '').replace(/^\/+/, '').replace(/\\/g, '/');
    if (!path || path.includes('..') || path.startsWith('/') || /^[a-z]+:/i.test(path)) {
      return null;
    }
    if (!path.toLowerCase().endsWith('.md')) return null;
    return path;
  }

  function dirname(path) {
    const i = path.lastIndexOf('/');
    return i >= 0 ? path.slice(0, i + 1) : '';
  }

  function joinPath(baseDir, rel) {
    if (/^[a-z]+:/i.test(rel) || rel.startsWith('//') || rel.startsWith('#') || rel.startsWith('mailto:')) {
      return rel;
    }
    const stack = baseDir ? baseDir.replace(/\/$/, '').split('/') : [];
    for (const part of rel.split('/')) {
      if (!part || part === '.') continue;
      if (part === '..') stack.pop();
      else stack.push(part);
    }
    return stack.join('/');
  }

  function rewriteLinks(root, baseDir) {
    root.querySelectorAll('a[href]').forEach((a) => {
      const href = a.getAttribute('href');
      if (!href || /^[a-z]+:/i.test(href) || href.startsWith('//') || href.startsWith('#') || href.startsWith('mailto:')) {
        return;
      }
      const resolved = joinPath(baseDir, href);
      if (resolved.toLowerCase().endsWith('.md')) {
        a.setAttribute('href', 'md.html?src=' + encodeURIComponent(resolved));
      } else {
        a.setAttribute('href', resolved);
      }
    });
    root.querySelectorAll('img[src]').forEach((img) => {
      const srcAttr = img.getAttribute('src');
      if (!srcAttr || /^[a-z]+:/i.test(srcAttr) || srcAttr.startsWith('//') || srcAttr.startsWith('data:')) return;
      img.setAttribute('src', joinPath(baseDir, srcAttr));
    });
  }

  const safeSrc = normalizeSrc(src);
  if (!safeSrc) {
    showError('缺少或非法的 src 参数。示例：md.html?src=guides/lectures/06-vLLM-Step-的解剖.md');
    return;
  }

  srcLabel.textContent = safeSrc;
  rawLink.hidden = false;
  rawLink.href = safeSrc;
  rawLink.textContent = '查看源文件';

  fetch(safeSrc)
    .then((r) => {
      if (!r.ok) throw new Error('无法加载 ' + safeSrc + '（HTTP ' + r.status + '）');
      return r.text();
    })
    .then((md) => {
      loading.style.display = 'none';
      const titleMatch = md.match(/^#\s+(.+)$/m);
      if (titleMatch) document.title = titleMatch[1].trim() + ' — 导读';
      content.innerHTML = marked.parse(md, { gfm: true, breaks: false });
      rewriteLinks(content, dirname(safeSrc));
    })
    .catch((err) => showError(err.message || String(err)));
})();
</script>
</body>
</html>
